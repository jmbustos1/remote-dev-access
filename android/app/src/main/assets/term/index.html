<!DOCTYPE html>
<!--
  Terminal de la APK: xterm.js (el mismo emulador que usa la terminal de VS Code).
  Puente con Kotlin:
    JS → Kotlin  RDA.input(texto) · RDA.resize(cols, filas, ancho, alto) · RDA.ready(cols, filas) · RDA.ctrlUsed()
    Kotlin → JS  rdaWrite(base64) · rdaCtrl(bool) · rdaFont(px) · rdaFocus() · rdaReset()
-->
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="xterm.css">
<style>
  html, body { margin: 0; height: 100%; background: #1e1e1e; overflow: hidden; }
  #term { position: absolute; inset: 2px; }
</style>
</head>
<body>
<div id="term"></div>
<script src="xterm.js"></script>
<script src="addon-fit.js"></script>
<script>
  const term = new Terminal({
    fontFamily: 'monospace',
    fontSize: 13,
    cursorBlink: true,
    scrollback: 2000,
    allowProposedApi: true,
    theme: { background: '#1e1e1e' },
  });
  const fit = new FitAddon.FitAddon();
  term.loadAddon(fit);
  term.open(document.getElementById('term'));

  // Ctrl "pegajoso": lo arma la tecla Ctrl de la barra de Kotlin y se aplica a
  // la siguiente letra que llegue del teclado del celular (Ctrl+C, Ctrl+B…).
  let ctrl = false;
  function applyCtrl(data) {
    if (!ctrl || data.length !== 1) return data;
    const c = data.toUpperCase().charCodeAt(0);
    if (c >= 0x40 && c <= 0x5f) {          // @ A–Z [ \ ] ^ _
      ctrl = false; RDA.ctrlUsed();
      return String.fromCharCode(c & 0x1f);
    }
    if (data === ' ') { ctrl = false; RDA.ctrlUsed(); return '\x00'; }
    return data;
  }
  term.onData(d => RDA.input(applyCtrl(d)));
  term.onBinary(d => RDA.input(d));

  let last = '';
  function refit() {
    // Durante animaciones (teclado apareciendo) el contenedor pasa por tamaños
    // transitorios: un tamaño absurdo no se le informa al PC.
    const dims = fit.proposeDimensions();
    if (!dims || dims.cols < 10 || dims.rows < 3) return;
    try { fit.fit(); } catch (e) { return; }
    const now = term.cols + 'x' + term.rows;
    if (now !== last) {
      last = now;
      RDA.resize(term.cols, term.rows, window.innerWidth, window.innerHeight);
    }
  }
  let pending = 0;
  const schedule = () => { clearTimeout(pending); pending = setTimeout(refit, 100); };
  new ResizeObserver(schedule).observe(document.getElementById('term'));
  window.addEventListener('resize', schedule);

  // Scroll con el dedo: xterm.js no lo trae en pantallas táctiles, pero sí sabe
  // qué hacer con la rueda del mouse (con tmux `mouse on` le manda la rueda y
  // tmux entra al modo copia; sin tmux recorre el historial). Traducimos el
  // deslizamiento a eventos de rueda. Arrastrar hacia abajo = ver lo anterior.
  const screenEl = document.querySelector('.xterm-screen');
  const touchEl = document.getElementById('term');
  const LINES_PER_WHEEL = 3; // tmux mueve 5 líneas por evento: uno cada 3 líneas de dedo (~1,5×)
  let lastY = null, acc = 0, scrolling = false;
  touchEl.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) { lastY = null; return; }
    lastY = e.touches[0].clientY; acc = 0; scrolling = false;
  }, { passive: true });
  touchEl.addEventListener('touchmove', e => {
    if (lastY === null) return;
    const t = e.touches[0];
    acc += lastY - t.clientY; // > 0: el dedo sube → avanzar hacia lo más nuevo
    lastY = t.clientY;
    const step = (touchEl.clientHeight / term.rows) * LINES_PER_WHEEL;
    while (Math.abs(acc) >= step) {
      const dir = acc > 0 ? 1 : -1;
      acc -= dir * step;
      scrolling = true;
      screenEl.dispatchEvent(new WheelEvent('wheel', {
        deltaY: dir, deltaMode: WheelEvent.DOM_DELTA_LINE,
        clientX: t.clientX, clientY: t.clientY, bubbles: true, cancelable: true,
      }));
    }
    if (scrolling) e.preventDefault(); // que no lo tome además como selección
  }, { passive: false });
  touchEl.addEventListener('touchend', () => { lastY = null; }, { passive: true });

  window.rdaWrite = b64 => {
    const bin = atob(b64);
    const bytes = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
    term.write(bytes);
  };
  window.rdaCtrl = on => { ctrl = on; };
  window.rdaFont = px => { term.options.fontSize = px; refit(); };
  window.rdaFocus = () => term.focus();
  window.rdaReset = () => { term.reset(); last = ''; refit(); };

  fit.fit();
  last = term.cols + 'x' + term.rows;
  RDA.ready(term.cols, term.rows);
</script>
</body>
</html>
